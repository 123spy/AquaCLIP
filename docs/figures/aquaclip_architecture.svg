<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520">
  <defs>
    <style>
      .title{font:700 24px Arial,Helvetica,sans-serif;fill:#102033}
      .label{font:600 15px Arial,Helvetica,sans-serif;fill:#102033}
      .small{font:13px Arial,Helvetica,sans-serif;fill:#405166}
      .box{fill:#ffffff;stroke:#284b63;stroke-width:1.6;rx:8}
      .blue{fill:#e9f3ff;stroke:#276fbf}
      .green{fill:#ecf8ef;stroke:#27864d}
      .gold{fill:#fff6df;stroke:#a87600}
      .purple{fill:#f3ecff;stroke:#7656b8}
      .head{fill:#102033;stroke:#102033}
      .arrow{stroke:#23384f;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#23384f"/>
    </marker>
  </defs>
  <rect width="1040" height="520" fill="#f7f9fc"/>
  <text x="40" y="48" class="title">AquaCLIP-QA Final Architecture</text>
  <text x="40" y="76" class="small">Physics-calibrated concat fusion for no-reference underwater image quality assessment.</text>

  <rect x="50" y="210" width="160" height="82" class="box"/>
  <text x="82" y="246" class="label">Input Image</text>
  <text x="78" y="270" class="small">underwater RGB</text>

  <rect x="280" y="96" width="200" height="88" class="box blue"/>
  <text x="312" y="131" class="label">CLIP Visual Prior</text>
  <text x="322" y="155" class="small">512-d embedding</text>

  <rect x="280" y="216" width="200" height="88" class="box gold"/>
  <text x="306" y="251" class="label">Attribute Probe</text>
  <text x="318" y="275" class="small">7 prompt scores</text>

  <rect x="280" y="336" width="200" height="88" class="box green"/>
  <text x="302" y="371" class="label">Physics Encoder</text>
  <text x="318" y="395" class="small">18 degradation cues</text>

  <rect x="550" y="220" width="210" height="86" class="box purple"/>
  <text x="582" y="253" class="label">Attribute Gate</text>
  <text x="584" y="277" class="small">attr * sigmoid(MLP(physics))</text>

  <rect x="550" y="340" width="210" height="86" class="box"/>
  <text x="592" y="373" class="label">Branch Projection</text>
  <text x="598" y="397" class="small">z_clip, z_attr, z_phys</text>

  <rect x="820" y="220" width="170" height="86" class="box head"/>
  <text x="858" y="253" class="label" fill="#ffffff">Concat Fusion</text>
  <text x="852" y="277" class="small" fill="#d7e3ef">MLP quality head</text>

  <rect x="820" y="350" width="170" height="74" class="box blue"/>
  <text x="844" y="382" class="label">Normalized MOS</text>
  <text x="864" y="405" class="small">quality score</text>

  <path d="M210 250 C240 250 250 140 280 140" class="arrow"/>
  <path d="M210 250 C240 250 250 260 280 260" class="arrow"/>
  <path d="M210 250 C240 250 250 380 280 380" class="arrow"/>
  <path d="M480 260 L550 260" class="arrow"/>
  <path d="M480 380 C520 380 520 298 550 278" class="arrow"/>
  <path d="M480 140 C520 140 515 358 550 362" class="arrow"/>
  <path d="M760 264 L820 264" class="arrow"/>
  <path d="M760 384 C795 384 795 300 820 280" class="arrow"/>
  <path d="M905 306 L905 350" class="arrow"/>
</svg>
