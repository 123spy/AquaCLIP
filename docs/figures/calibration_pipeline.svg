<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360">
  <defs>
    <style>
      .title{font:700 24px Arial,Helvetica,sans-serif;fill:#102033}
      .label{font:600 15px Arial,Helvetica,sans-serif;fill:#102033}
      .small{font:13px Arial,Helvetica,sans-serif;fill:#405166}
      .box{fill:#ffffff;stroke:#284b63;stroke-width:1.6;rx:8}
      .blue{fill:#e9f3ff;stroke:#276fbf}
      .green{fill:#ecf8ef;stroke:#27864d}
      .gold{fill:#fff6df;stroke:#a87600}
      .arrow{stroke:#23384f;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#23384f"/>
    </marker>
  </defs>
  <rect width="1040" height="360" fill="#f7f9fc"/>
  <text x="40" y="48" class="title">Few-Shot Positive Affine Calibration</text>
  <text x="40" y="76" class="small">Optional target-domain score alignment for cross-dataset evaluation.</text>

  <rect x="70" y="145" width="190" height="82" class="box blue"/>
  <text x="102" y="180" class="label">AquaCLIP-QA</text>
  <text x="104" y="204" class="small">normalized prediction y_hat</text>

  <rect x="340" y="120" width="220" height="74" class="box gold"/>
  <text x="382" y="151" class="label">1% / 5% Labels</text>
  <text x="373" y="174" class="small">few target-domain MOS</text>

  <rect x="340" y="230" width="220" height="74" class="box green"/>
  <text x="374" y="261" class="label">Positive Affine Fit</text>
  <text x="392" y="284" class="small">y_cal = a y_hat + b, a &gt; 0</text>

  <rect x="650" y="145" width="220" height="82" class="box"/>
  <text x="705" y="180" class="label">Calibrated Score</text>
  <text x="696" y="204" class="small">aligned MOS scale</text>

  <path d="M260 186 L340 267" class="arrow"/>
  <path d="M450 194 L450 230" class="arrow"/>
  <path d="M560 267 C610 267 615 186 650 186" class="arrow"/>
</svg>
